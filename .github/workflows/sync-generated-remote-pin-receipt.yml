name: Refresh generated public pages for phone PIN receipt verification
on:
  push:
    branches:
      - fix/phone-pin-verifiable-host-receipt-2026-11-07

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/kamera/downloads/**
            !/kamera/updates/**
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate public site in current PWA version
        run: node scripts/build-marketing.mjs
      - name: Update generated HTML only
        shell: bash
        run: |
          git add -- kamera/*.html kamera/blog/*.html
          if git diff --cached --quiet; then
            echo "Public pages match version.json"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "build(pwa): generate public pages for verified PIN receipt build 272"
          git push origin "HEAD:refs/heads/fix/phone-pin-verifiable-host-receipt-2026-11-07"
