name: MOBILE | Android | Podpisane APK i aktualizacje
on:
  push:
    branches: [main]
    paths: ['native-mobile/android/**', '.github/workflows/android-release.yml', 'scripts/publish-android-release.py']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: android-owner-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            native-mobile
            scripts
            kamera/android-update.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare owner signing key without logging secret values
        env:
          SIGNING_JSON: ${{ secrets.HOME_SECURITY_ANDROID_SIGNING }}
          RELEASE_RUN: ${{ github.run_number }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,base64,pathlib
          data=json.loads(os.environ['SIGNING_JSON'])
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'home-security-owner.p12'
          p.write_bytes(base64.b64decode(data['keystoreBase64'],validate=True))
          p.chmod(0o600)
          values={'HOME_SECURITY_ANDROID_KEYSTORE':str(p),'HOME_SECURITY_ANDROID_STORE_PASSWORD':data['storePassword'],'HOME_SECURITY_ANDROID_KEY_PASSWORD':data['keyPassword'],'HOME_SECURITY_ANDROID_KEY_ALIAS':data['keyAlias'],'HOME_SECURITY_ANDROID_VERSION_CODE':str(3000+2*int(os.environ['RELEASE_RUN'])),'HOME_SECURITY_ANDROID_VERSION_NAME':'0.3.'+os.environ['RELEASE_RUN']}
          for key in ['storePassword','keyPassword','keystoreBase64']:
              print('::add-mask::'+data[key])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for k,v in values.items():
                  if '\n' in v or '\r' in v: raise ValueError('Invalid signing configuration')
                  f.write(k+'='+v+'\n')
          PY
      - name: Test and build signed release
        working-directory: native-mobile/android
        run: gradle --no-daemon :app:testDirectDebugUnitTest :app:testPlayDebugUnitTest :app:lintDirectRelease :app:lintPlayRelease :app:assembleDirectRelease :app:bundlePlayRelease
      - name: Verify signature, package and update metadata
        env:
          OWNER_CERT: 7707e0ab9616e88ea2e98416d7e6b98f30fdb79f8bd673b083f95b02a4e07d47
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-dist"
          apk="$RUNNER_TEMP/android-dist/HOME-SECURITY-Android-$HOME_SECURITY_ANDROID_VERSION_NAME.apk"
          cp native-mobile/android/app/build/outputs/apk/direct/release/app-direct-release.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/android-dist/SIGNATURE.txt"
          grep -F "Signer #1 certificate SHA-256 digest: $OWNER_CERT" "$RUNNER_TEMP/android-dist/SIGNATURE.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/android-dist/PACKAGE.txt"
          grep -F "name='pl.solorz.homesecurity'" "$RUNNER_TEMP/android-dist/PACKAGE.txt"
          grep -F "versionCode='$HOME_SECURITY_ANDROID_VERSION_CODE'" "$RUNNER_TEMP/android-dist/PACKAGE.txt"
          python3 - <<'PY'
          import os,pathlib,hashlib,json
          name=os.environ['HOME_SECURITY_ANDROID_VERSION_NAME'];root=pathlib.Path(os.environ['RUNNER_TEMP'])/'android-dist';apk=root/('HOME-SECURITY-Android-'+name+'.apk');sha=hashlib.sha256(apk.read_bytes()).hexdigest()
          data={'enabled':True,'schema':1,'packageName':'pl.solorz.homesecurity','versionCode':int(os.environ['HOME_SECURITY_ANDROID_VERSION_CODE']),'versionName':name,'url':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/android-'+name+'/'+apk.name,'sha256':sha,'size':apk.stat().st_size,'signingCertificateSha256':os.environ['OWNER_CERT'],'sourceCommit':os.environ['GITHUB_SHA']}
          (root/'android-update.json').write_text(json.dumps(data,indent=2)+'\n')
          (root/'SHA256SUMS.txt').write_text(sha+'  '+apk.name+'\n')
          PY
      - name: Verify and retain signed Google Play bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/play-dist"
          bundle="native-mobile/android/app/build/outputs/bundle/playRelease/app-play-release.aab"
          python3 native-mobile/android/verify-play-bundle.py "$bundle"
          LC_ALL=C jarsigner -verify "$bundle" > "$RUNNER_TEMP/play-dist/SIGNATURE.txt"
          grep -F 'jar verified.' "$RUNNER_TEMP/play-dist/SIGNATURE.txt"
          cp "$bundle" "$RUNNER_TEMP/play-dist/HOME-SECURITY-Play-$HOME_SECURITY_ANDROID_VERSION_NAME.aab"
          cd "$RUNNER_TEMP/play-dist"
          sha256sum *.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signed-google-play-bundle
          path: ${{ runner.temp }}/play-dist/
          if-no-files-found: error
          retention-days: 30
      - name: Build next-version upgrade probe using the same owner key
        working-directory: native-mobile/android
        shell: bash
        run: |
          set -euo pipefail
          export HOME_SECURITY_ANDROID_VERSION_CODE=$((HOME_SECURITY_ANDROID_VERSION_CODE+1))
          gradle --no-daemon :app:assembleDirectRelease
          cp app/build/outputs/apk/direct/release/app-direct-release.apk "$RUNNER_TEMP/upgrade-probe.apk"
      - name: Enable emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify signed APK installation and in-place upgrade on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: |
            adb install -r "$RUNNER_TEMP/android-dist/HOME-SECURITY-Android-$HOME_SECURITY_ANDROID_VERSION_NAME.apk"
            adb shell am start -W -n pl.solorz.homesecurity/.MainActivity
            adb shell pidof pl.solorz.homesecurity
            adb install -r "$RUNNER_TEMP/upgrade-probe.apk"
            adb shell dumpsys package pl.solorz.homesecurity | grep "versionCode=$((HOME_SECURITY_ANDROID_VERSION_CODE+1)) "
            adb shell am start -W -n pl.solorz.homesecurity/.MainActivity
            adb shell pidof pl.solorz.homesecurity
      - name: Remove private key from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/home-security-owner.p12"
      - name: Publish verified APK and update channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish-android-release.py "$RUNNER_TEMP/android-dist"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-android-release
          path: ${{ runner.temp }}/android-dist/
          retention-days: 30
