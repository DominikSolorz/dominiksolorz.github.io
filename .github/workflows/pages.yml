name: Deploy DS Stream Support to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Frontend regression tests
        run: node --test tests/*.test.mjs
      - name: Agent regression and crash tests
        run: dotnet run --project agent-tests/HomeSecurity.Agent.Tests.csproj -c Release -- --process-crash agent/bin/Release/net10.0-windows/HomeSecurityAgent.dll
      - name: Desktop compilation
        run: dotnet build desktop-client/HomeSecurityDesktop.csproj -c Release
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare bounded static distribution
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='_site/' --exclude='kamera/updates/*.zip' ./ _site/
          mkdir -p _site/kamera/updates
          current=$(node -p 'JSON.parse(require("fs").readFileSync("kamera/desktop-update.json","utf8")).version')
          cp "kamera/updates/HomeSecurityDesktop-${current}-win-x64.zip" _site/kamera/updates/
          # Keep the previous verified release as a rollback package. Older
          # binaries remain in Git, not in the size-limited Pages artifact.
          cp kamera/updates/HomeSecurityDesktop-1.4.4-win-x64.zip _site/kamera/updates/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
