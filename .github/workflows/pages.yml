name: Deploy DS Stream Support to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Run checks concurrently; only serialize Pages uploads.
# A slow Windows build must not queue unrelated website releases.
jobs:
  verify-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/kamera/updates/**
            !/kamera/downloads/**
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and verify current release from the exact source commit
        run: node scripts/desktop-release.mjs fetch
      - name: Generate consistent public marketing pages
        run: node scripts/build-marketing.mjs
      - name: Frontend regression tests
        run: node --test tests/*.test.mjs
      - name: Verify public audit script syntax
        run: node --check scripts/verify-live-marketing.mjs
      - name: Verify marketing image optimizer syntax
        run: node --check scripts/optimize-marketing-images.mjs
  verify-desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/kamera/updates/**
            !/kamera/downloads/**
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Agent regression and crash tests
        run: dotnet run --project agent-tests/HomeSecurity.Agent.Tests.csproj -c Release -- --process-crash agent/bin/Release/net10.0-windows/HomeSecurityAgent.dll
      - name: Desktop compilation
        run: dotnet build desktop-client/HomeSecurityDesktop.csproj -c Release
      - name: Independent Drive uploader compilation
        run: dotnet build drive-sync/HomeSecurity.DriveSync.csproj -c Release
  deploy:
    needs: verify-frontend
    concurrency:
      group: pages-publish
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/kamera/updates/**
            !/kamera/downloads/**
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch current release and rollback package
        run: node scripts/desktop-release.mjs fetch --rollback
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Generate consistent marketing pages for deployment
        run: node scripts/build-marketing.mjs
      - name: Prepare bounded static distribution
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='_site/' --exclude='kamera/updates/*.zip' ./ _site/
          mkdir -p _site/kamera/updates
          current=$(node -p 'JSON.parse(require("fs").readFileSync("kamera/desktop-update.json","utf8")).version')
          cp "kamera/updates/HomeSecurityDesktop-${current}-win-x64.zip" _site/kamera/updates/
          # Keep the previous verified release as a rollback package. Older
          # binaries remain in Git, not in the size-limited Pages artifact.
          cp kamera/updates/HomeSecurityDesktop-1.4.7-win-x64.zip _site/kamera/updates/
      - name: Produce responsive WebP images for public pages
        shell: bash
        run: |
          set -euo pipefail
          # Install AFTER rsync so node_modules are not added to the Pages artifact.
          npm install --no-save --no-package-lock --ignore-scripts sharp@0.34
          node scripts/optimize-marketing-images.mjs _site
          test -s _site/kamera/assets/home-security-hero-640.webp
          test -s _site/kamera/assets/ds-logo-96.webp
          test -s _site/docs/ui-193/01-pulpit-960.webp
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live-marketing:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/kamera/updates/**
            !/kamera/downloads/**
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real public GitHub Pages URLs after deployment
        run: node scripts/verify-live-marketing.mjs
      - name: Capture browser screenshots of public marketing pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website-previews
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::warning::Chrome is not available on this runner; HTTP smoke tests still ran."
            exit 0
          fi
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --hide-scrollbars --no-first-run --window-size=1440,900 --virtual-time-budget=2500 --screenshot=website-previews/home-desktop.png https://dominiksolorz.github.io/kamera/o-systemie.html || true
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --hide-scrollbars --no-first-run --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=2500 --screenshot=website-previews/home-mobile.png https://dominiksolorz.github.io/kamera/o-systemie.html || true
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --hide-scrollbars --no-first-run --window-size=1440,900 --virtual-time-budget=2500 --screenshot=website-previews/gallery-desktop.png https://dominiksolorz.github.io/kamera/galeria.html || true
          # These are screenshots of the real PUBLIC login and registration routes.
          # No account data is entered and no camera footage is accessed.
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --hide-scrollbars --no-first-run --window-size=1280,900 --virtual-time-budget=3500 --screenshot=website-previews/login-real-ui.png "https://dominiksolorz.github.io/kamera/?auth=login" || true
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --hide-scrollbars --no-first-run --window-size=1280,900 --virtual-time-budget=3500 --screenshot=website-previews/register-real-ui.png "https://dominiksolorz.github.io/kamera/?auth=register" || true
          ls -lh website-previews
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-security-public-browser-screenshots
          path: website-previews/*.png
          if-no-files-found: warn
          retention-days: 14
