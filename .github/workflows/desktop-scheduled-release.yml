name: Check and publish current Windows installer
on:
  push:
    branches: [main]
    # Ship real Windows app/agent changes without waiting for the next 6-hour timer.
    # The release job fingerprints all bundled app assets and skips duplicate builds.
    paths:
      - '.github/workflows/desktop-scheduled-release.yml'
      - 'scripts/desktop-release.mjs'
      - 'scripts/build-marketing.mjs'
      - 'scripts/build-documents.mjs'
      - 'design/marketing/**'
      - 'design/documents/**'
      - 'desktop-client/**'
      - 'agent/**'
      - 'agent-client/**'
      - 'agent-contracts/**'
      - 'kamera/*.js'
      - 'kamera/*.mjs'
      - 'kamera/*.css'
      - 'kamera/*.webmanifest'
      - 'kamera/index.html'
      - 'kamera/core/**'
      - 'kamera/communication/**'
      - 'kamera/version.json'
      - 'kamera/sw.js'
      # Retest immediately when a regression-test fix unblocks a pending Windows release.
      - 'tests/**'
  schedule:
    - cron: '23 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: stable-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/kamera/updates/**
            !/kamera/downloads/**
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: plan
        name: Detect application changes without generating duplicate releases
        run: node scripts/desktop-release.mjs plan
      - uses: actions/setup-dotnet@v4
        if: steps.plan.outputs.changed == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Prepare matching native and public download versions
        if: steps.plan.outputs.changed == 'true'
        run: node scripts/desktop-release.mjs prepare
      - name: Test agent and crash recovery before building
        if: steps.plan.outputs.changed == 'true'
        shell: pwsh
        run: |
          dotnet run --project agent-tests/HomeSecurity.Agent.Tests.csproj -c Release -- --process-crash agent/bin/Release/net10.0-windows/HomeSecurityAgent.dll
          if($LASTEXITCODE -ne 0){throw 'Agent or crash tests failed'}
      - name: Build Windows application, agent, ZIP and installer
        if: steps.plan.outputs.changed == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          $ErrorActionPreference='Stop'
          & ./desktop-client/build-release.ps1 -Version $env:RELEASE_VERSION
          if($LASTEXITCODE -ne 0){throw 'Native publish failed'}
          New-Item -ItemType Directory -Force kamera/updates,kamera/downloads | Out-Null
          Compress-Archive -Path "desktop-client/publish-$env:RELEASE_VERSION/*" -DestinationPath "kamera/updates/HomeSecurityDesktop-$env:RELEASE_VERSION-win-x64.zip" -CompressionLevel Optimal
          $iscc=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if(-not (Test-Path $iscc)){choco install innosetup -y --no-progress; if($LASTEXITCODE -ne 0){throw 'Installer compiler unavailable'}}
          & $iscc desktop-client/installer/HomeSecurityDesktop.iss
          if($LASTEXITCODE -ne 0){throw 'Installer build failed'}
          Copy-Item "desktop-client/installer-output/HOME-SECURITY-Desktop-Setup-$env:RELEASE_VERSION.exe" "kamera/downloads/HOME-SECURITY-Desktop-Setup-$env:RELEASE_VERSION.exe"
          git restore -- agent/packages.lock.json
          if($LASTEXITCODE -ne 0){throw 'Cannot restore the source dependency lock'}
          node scripts/desktop-release.mjs finish
          if($LASTEXITCODE -ne 0){throw 'Manifest generation failed'}
      - name: Verify recording storage in isolated real WebView2
        if: steps.plan.outputs.changed == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          $ErrorActionPreference='Stop'
          $report=Join-Path $env:GITHUB_WORKSPACE 'recording-storage-bridge.json'
          $exe=Join-Path $env:GITHUB_WORKSPACE "desktop-client/publish-$env:RELEASE_VERSION/HomeSecurityDesktop.exe"
          $probe=Start-Process -FilePath $exe -ArgumentList @('--recording-storage-test',('"'+$report+'"')) -WindowStyle Hidden -PassThru
          if(-not $probe.WaitForExit(60000)){throw 'Storage bridge test timed out'}
          if(-not (Test-Path $report)){throw 'Storage bridge report missing'}
          $result=Get-Content -Raw $report | ConvertFrom-Json
          if(-not $result.ok -or $result.spoolBytes -ne 1048613 -or -not $result.preservedAfterDisconnect){throw 'Native storage transfer or disconnect failed'}
      - name: Render real camera workspace in isolated WebView2
        if: steps.plan.outputs.changed == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force camera-ui-proof | Out-Null
          $report=Join-Path $env:GITHUB_WORKSPACE 'camera-ui-proof/result.json'
          $exe=Join-Path $env:GITHUB_WORKSPACE "desktop-client/publish-$env:RELEASE_VERSION/HomeSecurityDesktop.exe"
          $probe=Start-Process -FilePath $exe -ArgumentList @('--camera-workspace-test',('"'+$report+'"')) -WindowStyle Hidden -PassThru
          if(-not $probe.WaitForExit(60000)){throw 'Camera UI test timed out'}
          if(-not (Test-Path $report)){throw 'Camera UI test did not produce a result'}
          $result=Get-Content -Raw $report | ConvertFrom-Json
          if(-not $result.ok -or -not $result.primaryRetained -or $result.cameras -ne 50){throw 'Camera UI or resource ownership regression'}
      - uses: actions/upload-artifact@v4
        if: always() && steps.plan.outputs.changed == 'true'
        with:
          name: real-camera-workspace-ui-test
          path: camera-ui-proof/
          if-no-files-found: ignore
          retention-days: 14
      - name: Validate exact release files and frontend
        if: steps.plan.outputs.changed == 'true'
        shell: pwsh
        run: |
          node --test tests/*.test.mjs
          if($LASTEXITCODE -ne 0){throw 'Release tests failed; nothing is published'}
          node scripts/build-marketing.mjs --check
          if($LASTEXITCODE -ne 0){throw 'Public download pages are inconsistent'}
      - name: Publish tested release atomically and trigger website deployment
        if: steps.plan.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin main
          if($LASTEXITCODE -ne 0){throw 'Cannot verify main'}
          if((git rev-parse origin/main) -ne $env:GITHUB_SHA){throw 'Main changed during build. Keep current release; retry at next check.'}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -- 'kamera/*.html' desktop-client/Program.cs desktop-client/HomeSecurityDesktop.csproj desktop-client/installer/HomeSecurityDesktop.iss desktop-client/build-release.ps1 design/marketing/home.html kamera/index.html kamera/panel.html kamera/o-systemie.html kamera/blog kamera/galeria.html kamera/pobierz.html kamera/pomoc.html kamera/sitemap.xml scripts/verify-live-marketing.mjs kamera/desktop-update.json "kamera/updates/HomeSecurityDesktop-$env:RELEASE_VERSION-win-x64.zip" "kamera/downloads/HOME-SECURITY-Desktop-Setup-$env:RELEASE_VERSION.exe"
          if($LASTEXITCODE -ne 0){throw 'Cannot stage release'}
          git commit -m "Publish tested Windows installer $env:RELEASE_VERSION and matching download links"
          if($LASTEXITCODE -ne 0){throw 'Cannot commit release'}
          git push origin HEAD:main
          if($LASTEXITCODE -ne 0){throw 'Release not published'}
          # Token-created commits do not trigger push workflows. Dispatch explicitly.
          gh workflow run pages.yml --ref main --repo $env:GITHUB_REPOSITORY
          if($LASTEXITCODE -ne 0){throw 'Release committed, but website dispatch failed: rerun Pages deployment'}
      - name: Unchanged release
        if: steps.plan.outputs.changed != 'true'
        run: Write-Output 'Current installer already matches the application. No rebuild or website change needed.'
