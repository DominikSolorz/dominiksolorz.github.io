name: Refresh generated HOME SECURITY pages for remote PIN PR

on:
  push:
    branches:
      - feat/phone-pin-unlock-windows-2026-11-07

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/kamera/downloads/**
            !/kamera/updates/**
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update generated public pages from source for PWA build 271
        run: node scripts/build-marketing.mjs
      - name: Commit only generated HTML pages to this feature branch
        shell: bash
        run: |
          git add -- kamera/*.html kamera/blog/*.html
          if git diff --cached --quiet; then
            echo "Generated public pages are already current"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "build(pwa): refresh generated pages for phone unlock build 271"
          git push origin "HEAD:refs/heads/feat/phone-pin-unlock-windows-2026-11-07"
