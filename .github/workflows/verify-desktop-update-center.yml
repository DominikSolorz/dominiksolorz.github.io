name: Verify HOME SECURITY manual Windows update center

on:
  push:
    branches:
      - feat/manual-desktop-update-center-2026-11-07
      - fix/windows-update-center-integrated-2026-11-07
  pull_request:
    paths:
      - 'desktop-client/Program.cs'
      - 'tests/desktop-update-center.test.mjs'
      - 'tests/deployed-update-channels.test.mjs'
      - 'tests/update-flow.test.mjs'
      - '.github/workflows/verify-desktop-update-center.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-center:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/kamera/updates/**
            !/kamera/downloads/**
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile the real Windows program and updater
        run: dotnet build desktop-client/HomeSecurityDesktop.csproj -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify explicit owner control and rollback compatibility
        run: node --test tests/desktop-update-center.test.mjs tests/deployed-update-channels.test.mjs tests/native-update-rollback.test.mjs tests/update-flow.test.mjs tests/mobile-updates.test.mjs
