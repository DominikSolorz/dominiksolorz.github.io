plugins { id 'com.android.application' }
android {
    namespace 'pl.solorz.homesecurity'
    compileSdk 36
    defaultConfig {
        applicationId 'pl.solorz.homesecurity'
        minSdk 30
        targetSdk 36
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode Integer.parseInt(System.getenv('HOME_SECURITY_ANDROID_VERSION_CODE') ?: '3')
        versionName System.getenv('HOME_SECURITY_ANDROID_VERSION_NAME') ?: '0.3.0'
    }
    buildFeatures { buildConfig true }
    def signingPath = System.getenv('HOME_SECURITY_ANDROID_KEYSTORE')
    if (signingPath) {
        ['HOME_SECURITY_ANDROID_STORE_PASSWORD','HOME_SECURITY_ANDROID_KEY_ALIAS','HOME_SECURITY_ANDROID_KEY_PASSWORD'].each {
            if (!System.getenv(it)) throw new GradleException('Missing Android signing configuration: ' + it)
        }
        signingConfigs {
            ownerRelease {
                storeFile file(signingPath)
                storePassword System.getenv('HOME_SECURITY_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('HOME_SECURITY_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('HOME_SECURITY_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.preview'; versionNameSuffix '-preview' }
        release { minifyEnabled false; if (signingPath) signingConfig signingConfigs.ownerRelease }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
