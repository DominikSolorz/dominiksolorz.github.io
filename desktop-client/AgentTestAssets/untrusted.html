<!doctype html><html lang="pl"><meta charset="utf-8"><title>Test odmowy dostępu</title>
<body style="background:#100c12;color:white;font:18px system-ui;padding:30px">
<h1>Test niedozwolonego dokumentu</h1><p id="state">Sprawdzam brak dostępu do IPC…</p>
<script>
let received=false;
chrome.webview.addEventListener('message',event=>{if(event.data?.type==='agent.result')received=true;});
chrome.webview.postMessage({type:'agent.command',id:crypto.randomUUID(),name:'agent.ping',args:{}});
setTimeout(()=>{
 document.getElementById('state').textContent=received?'BŁĄD: dokument otrzymał odpowiedź':'OK: brak dostępu do IPC';
 chrome.webview.postMessage({type:'bridge-test.report',report:{passed:!received,scenario:'denied-document',received}});
},1800);
</script></body></html>
