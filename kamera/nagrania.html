<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#070b16">
<title>Nagrania — Kamera na żywo</title>
<link rel="stylesheet" href="style.css?v=15">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dot"></span><span>Kamera na żywo</span></div>
  <nav class="nav">
    <a class="navLink" href="./">Na żywo</a>
    <a class="navLink active" href="nagrania.html">Nagrania</a>
  </nav>
</header>
<main>
  <div class="layout">
    <div class="card">
      <div class="cardHead"><h2>📼 Nagrania</h2><button class="btn ghost small" id="refresh">↻ Odśwież</button></div>
      <p class="muted small">Dzień → godzina → pliki co 10 minut. „▶ Obejrzyj” otwiera nagranie w Google Drive, „🗑” przenosi je do kosza Google Drive. Lista działa także przy wyłączonym komputerze.</p>
      <div id="library" class="libList"></div>
    </div>
    <div class="card">
      <details>
        <summary class="muted">Folder na Google Drive (podgląd)</summary>
        <div class="library"><iframe id="lib" title="Nagrania z kamery" loading="lazy" referrerpolicy="no-referrer"></iframe></div>
        <div class="row"><a class="btn ghost" id="openDrive" target="_blank" rel="noopener">Otwórz w Google Drive</a></div>
      </details>
    </div>
  </div>
</main>
<script src="vendor/supabase.js?v=2.117.2"></script>
<script type="module">
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, DRIVE_SCRIPT_URL, driveWatchUrl } from "./config.js?v=22";
import { sign, targetString } from "./pin.js?v=14";
import { mountLibrary } from "./library-ui.js?v=19";
import { savedKey, channelFor } from "./access.js?v=14";

// Bez PIN-u — najpierw ekran PIN-u na stronie głównej, potem powrót tutaj.
const KEY = savedKey();
if (!KEY) location.replace("./?wroc=nagrania");

// Folder „nagrania” na Google Drive (podgląd; widoczny, jeśli udostępniony albo zalogowany właściciel).
const FOLDER_ID = "15c9XPFi55XkQnCjfW_cvDHqhEXo_M5V2";
document.getElementById("lib").src = `https://drive.google.com/embeddedfolderview?id=${FOLDER_ID}#list`;
document.getElementById("openDrive").href = `https://drive.google.com/drive/folders/${FOLDER_ID}`;

// Lista i usuwanie idą przez komputer-kamerę (to on ma dostęp do folderu Google Drive).
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
const pending = new Map();
let last = null; // ostatnia odpowiedź komputera (jednorazowy numer do podpisania usunięcia)
const ready = (async () => {
  const name = await channelFor(KEY);
  return new Promise(res => {
    const ch = supabase.channel(name, { config: { broadcast: { self: false } } });
    ch.on("broadcast", { event: "signal" }, ({ payload: m }) => {
      if (m?.type !== "lib-reply" || !pending.has(m.reqId)) return;
      last = m; pending.get(m.reqId)(m); pending.delete(m.reqId);
    });
    ch.subscribe(s => { if (s === "SUBSCRIBED") res(ch); });
  });
})();

async function request(type, extra = {}) {
  const ch = await ready;
  const reqId = crypto.randomUUID();
  const reply = new Promise((res, rej) => {
    pending.set(reqId, res);
    setTimeout(() => { if (pending.delete(reqId)) rej(new Error("Komputer z kamerą nie odpowiada (jest wyłączony albo strona kamery nie jest otwarta).")); }, 12000);
  });
  ch.send({ type: "broadcast", event: "signal", payload: { type, reqId, ...extra } });
  const m = await reply;
  if (m.error) throw new Error(m.error);
  return m;
}

async function remove(target) {
  if (!last?.nonce) await request("lib-days");
  const nonce = last.nonce;
  await request("lib-delete", { target, nonce, mac: await sign(KEY, `${nonce}|${targetString(target)}`) });
}

// Z podłączonym skryptem Google Drive lista idzie prosto z chmury — działa też przy wyłączonym komputerze.
// Token do skryptu wyliczany jest z klucza PIN-u (ten sam co na komputerze-kamerze).
async function drive(action, extra = {}) {
  const token = [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(`drive:${KEY}`)))].map(b => b.toString(16).padStart(2, "0")).join("");
  const res = await fetch(DRIVE_SCRIPT_URL, { method: "POST", body: JSON.stringify({ action, token, ...extra }), headers: { "Content-Type": "text/plain;charset=utf-8" } });
  if (!res.ok) throw new Error(`Google Drive odpowiedział ${res.status}`);
  const out = await res.json();
  if (out.error) throw new Error(out.error);
  return out;
}

const lib = mountLibrary(document.getElementById("library"), DRIVE_SCRIPT_URL ? {
  days: async () => (await drive("days")).days,
  day: async d => (await drive("day", { day: d })).hours,
  remove: t => drive("remove", { target: t }),
  watchUrl: driveWatchUrl,
} : {
  days: async () => (await request("lib-days")).days,
  day: async d => (await request("lib-day", { day: d })).hours,
  remove,
  watchUrl: driveWatchUrl,
});
document.getElementById("refresh").addEventListener("click", () => lib.refresh());
</script>
</body>
</html>
