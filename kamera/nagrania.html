<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b1120">
<title>Biblioteka nagrań</title>
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span>Biblioteka nagrań</div>
  <a class="btn ghost small" href="./">← Na żywo</a>
</header>
<main>
  <div class="card">
    <p class="muted small">Nagrania z kamery na Google Drive: <b>data → godzina → pliki co 10 minut</b> (nazwa pliku = data i godzina:minuta:sekunda startu). Kliknij folder, żeby wejść, a plik — żeby obejrzeć.</p>
    <div class="library">
      <iframe id="lib" title="Nagrania z kamery" loading="lazy" referrerpolicy="no-referrer"></iframe>
    </div>
    <div class="row">
      <a class="btn ghost" id="openDrive" target="_blank" rel="noopener">Otwórz w Google Drive</a>
    </div>
  </div>
</main>
<script>
  // Folder „nagrania” na Google Drive właściciela kamery (udostępniony „każdy z linkiem — przeglądający”).
  var FOLDER_ID = "15c9XPFi55XkQnCjfW_cvDHqhEXo_M5V2";
  document.getElementById("lib").src = "https://drive.google.com/embeddedfolderview?id=" + FOLDER_ID + "#list";
  document.getElementById("openDrive").href = "https://drive.google.com/drive/folders/" + FOLDER_ID;
</script>
</body>
</html>
